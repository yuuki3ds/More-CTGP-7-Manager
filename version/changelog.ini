en=More！CTGP-7 Manager
en=Ver.1.2.7
en=
en=Sending custom notifications!
en=
en=・The app now sends custom notifications—containing information such as changelogs—to the 3DS system’s notification list whenever an app update is completed.
en=*An option to enable/disable these notifications has been added to the settings.
en=
en=・Development of 3GX plugin versions for two "Extra" titles has been confirmed; these are now available for download within the app.
en=*Currently, this only applies to MK7.
en=*Files will be downloaded into the folder corresponding to the selected region.
en=*Please note that these are still under development, so do not expect flawless performance.
en=
en=・Added support for 3D display.
en=
en=・The system is now prevented from entering sleep mode during downloads and installations.
en=
en=・A notification window will now appear if there is insufficient space on the SD card during a download.
en=
en=・The installed version of the original CTGP-7 is now displayed within the app.
en=
en=・Various other UI-related adjustments.
en=
en=　　　　　　　　　　　　　　　　　　　　　More！CTGP-7
en=　　　　　　　　　　　　　　　　　　　yk/3DSProject Team
